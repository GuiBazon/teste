<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Especialidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilização customizada para a barra de rolagem */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white shadow-md p-6">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Painel de Progressão Pessoal</h1>
                <p class="text-blue-100 text-sm mt-1">Ramo Sênior • Tropa Taús • Patrulha Xingu</p>
            </div>
            <div class="bg-blue-700 px-4 py-2 rounded-lg text-sm font-medium">
                Progresso: <span id="stats-counter" class="font-bold text-yellow-300">0/0</span> Concluídas
            </div>
        </div>
    </header>

    <main class="max-w-6xl w-full mx-auto p-4 flex-1">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-col md:flex-row gap-4">
            <div class="flex-1">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Buscar Especialidade</label>
                <input type="text" id="search-input" placeholder="Digite para filtrar... (Ex: Acampamento)" 
                    class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
            </div>
            
            <div class="w-full md:w-48">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Filtrar por Status</label>
                <select id="status-filter" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                    <option value="all">Todas</option>
                    <option value="todo">Não Iniciadas</option>
                    <option value="wip">Em Andamento</option>
                    <option value="done">Concluídas</option>
                </select>
            </div>
        </div>

        <div id="grid-especialidades" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            </div>
    </main>

    <script>

cas de Sapa", "Técnicas Verticais", "Tênis", "Tênis de Mesa", "Topografia", "Trabalho Voluntário", "Tradições", "Tradições Indígenas", "Transporte Ferroviário", "Triatlo", "Vela", "Vendas", "Vendas", "Vídeo Maker", "Videogame", "Videomaker", "Vigilância Epidemiológica", "Vitrines", "Voleibol", "Web Design", "Web Design", "Xadrez", "Yoga", "Zoobotânica", "Zoologia"
        ];

        // Mapeando a lista para objetos com IDs únicos para gerenciar duplicados corretamente
        let especialidades = [];

        // Inicializa o sistema buscando dados do LocalStorage ou usando a lista padrão
        function init() {
            const dadosSalvos = localStorage.getItem('minhas_especialidades');
            if (dadosSalvos) {
                especialidades = JSON.parse(dadosSalvos);
            } else {
                especialidades = listaBruta.map((nome, index) => ({
                    id: index,
                    nome: nome,
                    status: 'todo' // 'todo' = Não iniciado, 'wip' = Em andamento, 'done' = Concluído
                }));
                salvarDados();
            }
            render();
        }

        function salvarDados() {
            localStorage.setItem('minhas_especialidades', JSON.stringify(especialidades));
            atualizarEstatisticas();
        }

        function atualizarEstatisticas() {
            const concluidas = especialidades.filter(e => e.status === 'done').length;
            document.getElementById('stats-counter').innerText = `${concluidas}/${especialidades.length}`;
        }

        // Altera o status da especialidade (Roda no evento 'change' do select de cada card)
        function alterarStatus(id, novoStatus) {
            especialidades = especialidades.map(e => e.id === id ? { ...e, status: novoStatus } : e);
            salvarDados();
            
            // Pequeno delay visual para dar feedback se estiver filtrado
            const filtroAtual = document.getElementById('status-filter').value;
            if (filtroAtual !== 'all') {
                render();
            }
        }

        // Função principal de Renderização na Tela (Manipulação de DOM pura)
        function render() {
            const grid = document.getElementById('grid-especialidades');
            const termoBusca = document.getElementById('search-input').value.toLowerCase();
            const filtroStatus = document.getElementById('status-filter').value;

            grid.innerHTML = ''; // Limpa a tela antes de renderizar

            especialidades.forEach(e => {
                // Regras de Filtro (Busca por texto + Status do Select)
                const bateComBusca = e.nome.toLowerCase().includes(termoBusca);
                const bateComStatus = filtroStatus === 'all' || e.status === filtroStatus;

                if (bateComBusca && bateComStatus) {
                    // Configuração de cores dinamicas baseadas no status
                    let bgCard = 'bg-white border-slate-200';
                    let selectColor = 'bg-slate-100 text-slate-700';
                    
                    if (e.status === 'wip') {
                        bgCard = 'bg-amber-50 border-amber-300';
                        selectColor = 'bg-amber-100 text-amber-800 border-amber-400';
                    } else if (e.status === 'done') {
                        bgCard = 'bg-emerald-50 border-emerald-300';
                        selectColor = 'bg-emerald-100 text-emerald-800 border-emerald-400';
                    }

                    const card = document.createElement('div');
                    card.className = `border rounded-xl p-4 flex flex-col justify-between shadow-sm transition-all hover:shadow-md ${bgCard}`;
                    card.innerHTML = `
                        <div class="mb-3">
                            <h3 class="font-semibold text-slate-800 text-base leading-tight">${e.nome}</h3>
                            <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">ID: #${e.id}</span>
                        </div>
                        <div>
                            <select onchange="alterarStatus(${e.id}, this.value)" 
                                class="w-full text-xs font-medium rounded-md p-2 border focus:outline-none transition-colors cursor-pointer ${selectColor}">
                                <option value="todo" ${e.status === 'todo' ? 'selected' : ''}>❌ Não Iniciada</option>
                                <option value="wip" ${e.status === 'wip' ? 'selected' : ''}>⏳ Em Andamento</option>
                                <option value="done" ${e.status === 'done' ? 'selected' : ''}>✅ Concluída</option>
                            </select>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });
        }

        // Listeners dos Inputs para filtro reativo (Roda a função sempre que digita ou muda o select)
        document.getElementById('search-input').addEventListener('input', render);
        document.getElementById('status-filter').addEventListener('change', render);

        // Inicializa o script quando a página carrega
        window.onload = init;
    </script>
</body>
</html>
